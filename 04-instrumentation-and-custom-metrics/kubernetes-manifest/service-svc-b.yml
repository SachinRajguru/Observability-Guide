apiVersion: v1
kind: Service
metadata:
  name: b-service
  namespace: dev

  labels:
    app: b-service
    job: node-api

spec:
  # ClusterIP is the default service type.
  #
  # Service B does not need a public load balancer.
  type: ClusterIP

  selector:
    app: service-b-deployment

  ports:
    - name: http
      port: 80
      targetPort: 3002
      protocol: TCP