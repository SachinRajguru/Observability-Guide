apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b-deployment
  namespace: dev
  labels:
    app: service-b-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: service-b-deployment

  template:
    metadata:
      labels:
        app: service-b-deployment

    spec:
      containers:
        - name: service-b

          # IMPORTANT:
          # This is Service B's image.
          #
          # The older implementation incorrectly referenced
          # the Service A image here.
          image: sachinrajguru/instrumentation-service-b:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3002
              protocol: TCP

          env:
            - name: PORT
              value: "3002"

            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://jaeger-collector.tracing:4318/v1/traces"

          readinessProbe:
            httpGet:
              path: /healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20