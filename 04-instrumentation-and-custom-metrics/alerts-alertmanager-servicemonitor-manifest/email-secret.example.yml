apiVersion: v1
kind: Secret
metadata:
  name: mail-pass
  namespace: monitoring

  labels:
    app: instrumentation-and-custom-metrics
    release: monitoring

type: Opaque

stringData:
  # DO NOT COMMIT A REAL PASSWORD.
  #
  # For Gmail, use an App Password where applicable.
  # Replace this value only in a local, uncommitted manifest.
  gmail-pass: "REPLACE_WITH_YOUR_EMAIL_APP_PASSWORD"