apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - alerts.yml
  - email-secret.example.yml
  - alertmanagerconfig.yml
  - serviceMonitor.yml

# Important security improvement
#
# For a public GitHub repository, I recommend eventually changing the Kustomization so the real Secret is supplied separately rather than applying email-secret.example.yml directly.
#
# For the learning lab:
#
# email-secret.example.yml
#
# documents the required structure.
#
# For an actual cluster:
#
# email-secret.yml
#
# should be created locally and added to .gitignore.