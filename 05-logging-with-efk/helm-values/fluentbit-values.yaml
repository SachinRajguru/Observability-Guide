# Fluent Bit values for — Logging with EFK

# This configuration is designed to collect the application logs
# generated by Topic 04:
#
#   Namespace:
#     dev
#
#   Service A:
#     a-service
#     container port: 3001
#
#   Service B:
#     b-service
#     container port: 3002
#
# Fluent Bit runs as a DaemonSet so that each EKS worker node
# can collect container logs generated on that node.
#
# Elasticsearch is deployed through the ECK eck-stack Helm chart
# with the Elasticsearch resource named "elasticsearch".
#
# Therefore the Elasticsearch HTTP service is:
#
#   elasticsearch-es-http
#
# Credentials are NOT stored in this file.

kind: DaemonSet

replicaCount: 1

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}

rbac:
  create: true
  nodeAccess: true
  eventsAccess: false

hostNetwork: false

dnsPolicy: ClusterFirst

service:
  type: ClusterIP
  port: 2020

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

dashboards:
  enabled: false

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /api/v2/health
    port: http

flush: 1

metricsPort: 2020

# -------------------------------------------------------------------
# Elasticsearch credentials
# -------------------------------------------------------------------
#
# ECK automatically creates:
#
#   elasticsearch-es-elastic-user
#
# The Secret contains the "elastic" password.
#
# We expose that Secret value inside the Fluent Bit container as:
#
#   ELASTICSEARCH_PASSWORD
#
# The password itself is never written to this values file.

env:
  - name: ELASTICSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-es-elastic-user
        key: elastic

# -------------------------------------------------------------------
# ECK Elasticsearch CA certificate
# -------------------------------------------------------------------
#
# ECK creates:
#
#   elasticsearch-es-http-certs-public
#
# This Secret contains the CA certificate required to verify the
# HTTPS connection to Elasticsearch.
#
# ECK enables HTTPS by default.

extraVolumes:
  - name: elasticsearch-ca
    secret:
      secretName: elasticsearch-es-http-certs-public

extraVolumeMounts:
  - name: elasticsearch-ca
    mountPath: /fluent-bit/tls
    readOnly: true

# -------------------------------------------------------------------
# Lua script
# -------------------------------------------------------------------
#
# We exclude the logging namespace so that Fluent Bit does not
# continuously collect logs generated by the logging infrastructure
# itself.
#
# Topic 04 application logs in namespace "dev" are therefore
# collected normally.

luaScripts:
  setIndex.lua: |
    function set_index(tag, timestamp, record)

        if record["kubernetes"] ~= nil then

            local namespace =
                record["kubernetes"]["namespace_name"]

            if namespace == "logging" then
                return -1, timestamp, record
            end

        end

        return 1, timestamp, record
    end

# -------------------------------------------------------------------
# Fluent Bit pipeline configuration
# -------------------------------------------------------------------

config:

  # ---------------------------------------------------------------
  # SERVICE
  # ---------------------------------------------------------------

  service: |
    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}

        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf

        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}

        Health_Check On

  # ---------------------------------------------------------------
  # INPUT
  # ---------------------------------------------------------------
  #
  # Topic 04 applications write their application logs to
  # stdout/stderr.
  #
  # Kubernetes/container runtime makes those logs available on
  # the worker node under /var/log/containers/.
  #
  # Fluent Bit tails those files.
  #

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log

        multiline.parser docker, cri

        Tag kube.*

        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

    # Collect kubelet system logs from the EKS worker nodes.
    [INPUT]
        Name systemd
        Tag host.*

        Systemd_Filter _SYSTEMD_UNIT=kubelet.service

        Read_From_Tail On

  # ---------------------------------------------------------------
  # FILTERS
  # ---------------------------------------------------------------
  #
  # The Kubernetes filter enriches Topic 04 application logs with
  # Kubernetes metadata such as:
  #
  #   namespace
  #   pod
  #   container
  #   labels
  #
  # This allows us to search logs in Kibana by Kubernetes metadata.
  #

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*

        Merge_Log On
        Keep_Log Off

        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    # Exclude logs generated by the EFK logging infrastructure.
    [FILTER]
        Name lua
        Match kube.*

        script /fluent-bit/scripts/setIndex.lua
        call set_index

  # ---------------------------------------------------------------
  # OUTPUT
  # ---------------------------------------------------------------
  #
  # Fluent Bit sends Kubernetes logs to the ECK-managed Elasticsearch
  # service over HTTPS.
  #
  # The namespace name is used as the index prefix.
  #
  # For Topic 04, application logs from:
  #
  #   dev
  #
  # will therefore be easy to identify in Elasticsearch/Kibana.
  #
  # Logstash_Prefix_Key uses the Kubernetes metadata created by
  # the Kubernetes filter.
  #

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*

        Host elasticsearch-es-http
        Port 9200

        HTTP_User elastic
        HTTP_Passwd ${ELASTICSEARCH_PASSWORD}

        tls On
        tls.verify On
        tls.ca_file /fluent-bit/tls/ca.crt

        Logstash_Format On
        Logstash_Prefix kubernetes
        Logstash_Prefix_Key $kubernetes['namespace_name']

        Suppress_Type_Name On

        Generate_ID On

        Retry_Limit False

    # Node/kubelet logs are stored separately from application logs.
    [OUTPUT]
        Name es
        Match host.*

        Host elasticsearch-es-http
        Port 9200

        HTTP_User elastic
        HTTP_Passwd ${ELASTICSEARCH_PASSWORD}

        tls On
        tls.verify On
        tls.ca_file /fluent-bit/tls/ca.crt

        Logstash_Format On
        Logstash_Prefix node

        Suppress_Type_Name On

        Generate_ID On

        Retry_Limit False

# -------------------------------------------------------------------
# Custom parser
# -------------------------------------------------------------------

customParsers: |
  [PARSER]
      Name docker_no_time
      Format json
      Time_Keep Off
      Time_Key time
      Time_Format %Y-%m-%dT%H:%M:%S.%L

# -------------------------------------------------------------------
# Node log volumes
# -------------------------------------------------------------------
#
# These host paths allow Fluent Bit to read logs generated on
# each EKS worker node.
#

daemonSetVolumes:

  - name: varlog
    hostPath:
      path: /var/log

  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

daemonSetVolumeMounts:

  - name: varlog
    mountPath: /var/log

  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

# -------------------------------------------------------------------
# Fluent Bit startup configuration
# -------------------------------------------------------------------

command:
  - /fluent-bit/bin/fluent-bit

args:
  - --workdir=/fluent-bit/etc
  - --config=/fluent-bit/etc/conf/fluent-bit.conf

logLevel: info

hotReload:
  enabled: false

  image:
    repository: ghcr.io/jimmidyson/configmap-reload
    tag: v0.15.0
    pullPolicy: IfNotPresent

  resources: {}