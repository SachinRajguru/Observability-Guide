# jaeger-values.yaml

# Jaeger v2 values for — Distributed Tracing with Jaeger

# This configuration is designed to receive distributed traces
# generated by the OpenTelemetry-instrumented applications from
# Topic 04:
#
#   Namespace:
#     dev
#
#   Service A:
#     a-service
#     container port: 3001
#
#   Service B:
#     b-service
#     container port: 3002
#
# Service A and Service B are already instrumented with
# OpenTelemetry and export traces using OTLP.
#
# Jaeger receives those traces through its OTLP endpoints:
#
#   OTLP gRPC:
#     4317
#
#   OTLP HTTP:
#     4318
#
# Elasticsearch is deployed through the ECK eck-stack Helm chart
# with the Elasticsearch resource named "elasticsearch".
#
# Therefore the Elasticsearch HTTP service is:
#
#   elasticsearch-es-http
#
# Elasticsearch is deployed in:
#
#   logging
#
# Credentials are NOT stored in this file.


fullnameOverride: jaeger


# -------------------------------------------------------------------
# Jaeger deployment
# -------------------------------------------------------------------
#
# Jaeger v2 uses a unified architecture based on the
# OpenTelemetry Collector framework.
#
# A separate Jaeger Agent is not required.
#
# The Jaeger instance receives OTLP traces directly from the
# instrumented applications.

jaeger:

  enabled: true

  replicas: 1


  # ---------------------------------------------------------------
  # Elasticsearch credentials
  # ---------------------------------------------------------------
  #
  # ECK automatically creates:
  #
  #   elasticsearch-es-elastic-user
  #
  # The Secret contains the "elastic" password.
  #
  # We expose the credentials inside the Jaeger container as:
  #
  #   ES_USERNAME
  #   ES_PASSWORD
  #
  # The password itself is never written to this values file.

  extraEnv:

    - name: ES_USERNAME
      value: elastic

    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-es-elastic-user
          key: elastic


  # ---------------------------------------------------------------
  # ECK Elasticsearch CA certificate
  # ---------------------------------------------------------------
  #
  # ECK creates:
  #
  #   elasticsearch-es-http-certs-public
  #
  # This Secret contains the CA certificate required to verify the
  # HTTPS connection to Elasticsearch.
  #
  # ECK enables HTTPS by default.
  #
  # The Secret is mounted directly into the Jaeger container.
  #
  # No separate ConfigMap is required.

  extraVolumes:

    - name: elasticsearch-ca
      secret:
        secretName: elasticsearch-es-http-certs-public


  extraVolumeMounts:

    - name: elasticsearch-ca
      mountPath: /es/certificates
      readOnly: true


# -------------------------------------------------------------------
# Jaeger v2 configuration
# -------------------------------------------------------------------
#
# Jaeger v2 uses the OpenTelemetry Collector configuration model.
#
# The configuration below defines:
#
#   Receivers
#       Receive OTLP traces from applications.
#
#   Processors
#       Batch traces before exporting them.
#
#   Exporters
#       Write traces to Elasticsearch through Jaeger storage.
#
#   Extensions
#       Provide Jaeger query and storage functionality.
#
# The Jaeger Query service reads trace data from Elasticsearch.
#

userconfig:


  # ---------------------------------------------------------------
  # SERVICE
  # ---------------------------------------------------------------

  service:

    extensions:
      - jaeger_storage
      - jaeger_query
      - healthcheckv2

    pipelines:

      traces:

        receivers:
          - otlp

        processors:
          - batch

        exporters:
          - jaeger_storage_exporter


    # -------------------------------------------------------------
    # Jaeger telemetry
    # -------------------------------------------------------------
    #
    # These are Jaeger's own metrics.
    #
    # They are separate from the application metrics generated by
    # Topic 04.

    telemetry:

      resource:
        service.name: jaeger

      metrics:

        level: detailed

        readers:

          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888


  # -----------------------------------------------------------------
  # EXTENSIONS
  # -----------------------------------------------------------------

  extensions:


    # -------------------------------------------------------------
    # Health check
    # -------------------------------------------------------------

    healthcheckv2:

      use_v2: true

      http:
        endpoint: 0.0.0.0:13133


    # -------------------------------------------------------------
    # Jaeger Query
    # -------------------------------------------------------------
    #
    # Jaeger Query reads traces from the configured storage backend.
    #
    # The UI uses this component to search and display traces.

    jaeger_query:

      storage:
        traces: primary_storage


    # -------------------------------------------------------------
    # Jaeger Storage
    # -------------------------------------------------------------
    #
    # Elasticsearch is used as the persistent trace storage backend.
    #
    # The Elasticsearch deployment comes from Topic 05.
    #
    # Elasticsearch endpoint:
    #
    #   https://elasticsearch-es-http.logging.svc.cluster.local:9200
    #
    # TLS verification is enabled.
    #
    # The CA certificate mounted above is used to verify the
    # Elasticsearch HTTPS certificate.

    jaeger_storage:

      backends:


        primary_storage:

          elasticsearch:

            server_urls:
              - https://elasticsearch-es-http.logging.svc.cluster.local:9200


            # -----------------------------------------------------
            # Elasticsearch authentication
            # -----------------------------------------------------
            #
            # The values are read from environment variables
            # injected above.
            #
            # No password is stored directly in this file.

            auth:

              basic:

                username: "$${ES_USERNAME}"
                password: "$${ES_PASSWORD}"


            # -----------------------------------------------------
            # Elasticsearch TLS
            # -----------------------------------------------------

            tls:

              insecure: false

              ca_file: /es/certificates/ca.crt


            # -----------------------------------------------------
            # Jaeger Elasticsearch indices
            # -----------------------------------------------------
            #
            # Trace data is stored using separate indices for:
            #
            #   spans
            #   services
            #   dependencies
            #   sampling
            #
            # A daily rollover keeps the indices separated by date.
            #
            # This configuration is suitable for the learning/lab
            # environment used by this repository.

            indices:

              index_prefix: jaeger-main


              spans:

                date_layout: "2006-01-02"

                rollover_frequency: day

                shards: 1

                replicas: 0


              services:

                date_layout: "2006-01-02"

                rollover_frequency: day

                shards: 1

                replicas: 0


              dependencies:

                date_layout: "2006-01-02"

                rollover_frequency: day

                shards: 1

                replicas: 0


              sampling:

                date_layout: "2006-01-02"

                rollover_frequency: day

                shards: 1

                replicas: 0


  # -----------------------------------------------------------------
  # RECEIVERS
  # -----------------------------------------------------------------
  #
  # Jaeger receives traces from the Topic 04 applications through
  # OpenTelemetry Protocol (OTLP).
  #
  # OTLP supports both:
  #
  #   gRPC
  #   HTTP

  receivers:


    otlp:

      protocols:


        # -----------------------------------------------------------
        # OTLP gRPC
        # -----------------------------------------------------------

        grpc:

          endpoint: 0.0.0.0:4317


        # -----------------------------------------------------------
        # OTLP HTTP
        # -----------------------------------------------------------

        http:

          endpoint: 0.0.0.0:4318


  # -----------------------------------------------------------------
  # PROCESSORS
  # -----------------------------------------------------------------
  #
  # Batch processor groups traces before they are written to
  # Elasticsearch.
  #
  # This reduces the number of individual export operations.

  processors:

    batch: {}


  # -----------------------------------------------------------------
  # EXPORTERS
  # -----------------------------------------------------------------
  #
  # The Jaeger storage exporter writes received traces to the
  # configured Jaeger storage backend.
  #
  # In this configuration:
  #
  #   Jaeger
  #       |
  #       v
  #   jaeger_storage_exporter
  #       |
  #       v
  #   primary_storage
  #       |
  #       v
  #   Elasticsearch

  exporters:

    jaeger_storage_exporter:

      trace_storage: primary_storage